spring.application.name=payment-settlement
server.port=8080

spring.datasource.url=jdbc:h2:mem:settlementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Kafka from docker-compose.yml, published on host port 9094 so that it cannot
# clash with a broker you already run on the default port.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9094

app.kafka.payments-topic=payment-events
app.kafka.topic-partitions=3
app.kafka.consumer-concurrency=6

logging.level.com.debuglab.settlement=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=WARN
