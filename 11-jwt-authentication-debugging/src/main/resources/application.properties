spring.application.name=ticket-service
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml on host port 3307. Throwaway credentials -
# replace all three if you point this at your own MySQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/ticketsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ticketuser
spring.datasource.password=ticketpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# JWT settings.
#
# jwt.secret is a PLACEHOLDER for local development only. In any real
# environment supply it from the environment instead, e.g.
#     export JWT_SECRET=...        (Spring maps JWT_SECRET -> jwt.secret)
# and never commit the real value.
# ---------------------------------------------------------------------------
jwt.secret=change-me-secret
jwt.expiration-seconds=3600

logging.level.org.springframework.security=DEBUG
logging.level.com.debuglab.tickets=DEBUG
