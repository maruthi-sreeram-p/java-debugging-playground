spring.application.name=auth-service
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml on host port 3307. Throwaway credentials -
# replace all three if you point this at your own MySQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=authuser
spring.datasource.password=authpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Watch the security filter chain make its decisions.
logging.level.org.springframework.security=DEBUG
logging.level.com.debuglab.auth=DEBUG
