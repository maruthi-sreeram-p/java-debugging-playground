spring.application.name=pricing-service
server.port=8080

# ---------------------------------------------------------------------------
# MySQL and Redis from docker-compose.yml, on host ports 3307 and 6380 so that
# neither can clash with a server you already run locally.
#
# Throwaway credentials. Replace them if you point this at your own servers.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/pricingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=pricinguser
spring.datasource.password=pricingpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.cache.type=redis

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

logging.level.com.debuglab.pricing=INFO
