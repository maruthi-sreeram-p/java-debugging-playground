spring.application.name=task-manager
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml on host port 3307. Throwaway credentials -
# replace all three if you point this at your own MySQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/tasksdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=taskuser
spring.datasource.password=taskpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Prints which authorities each request carried and which rule refused it.
logging.level.org.springframework.security=DEBUG
logging.level.com.debuglab.tasks=DEBUG
