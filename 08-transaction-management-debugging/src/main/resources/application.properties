spring.application.name=banking-transfers
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml, published on host port 3307 so that it cannot
# clash with a MySQL you already run on the default port.
#
# Throwaway credentials from docker-compose.yml. Replace all three if you point
# this application at your own MySQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/bankdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bankuser
spring.datasource.password=bankpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Watch transaction boundaries being opened, joined, committed and rolled back.
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.com.debuglab.banking=DEBUG
