spring.application.name=checkout-platform
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml, published on host port 3307 so that it cannot
# clash with a MySQL you already run on 3306.
#
# Throwaway development credentials. Replace them here and in
# docker-compose.yml if you point this at your own database.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/checkoutdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=checkoutuser
spring.datasource.password=checkoutpw
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Redis, published on host port 6380.
# ---------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6380
checkout.cache.ttl-minutes=10

# ---------------------------------------------------------------------------
# Kafka, published on host port 9094.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.debuglab.checkout.event
spring.kafka.listener.missing-topics-fatal=false

checkout.topic.orders=checkout.orders

# ---------------------------------------------------------------------------
# JWT signing key. This is a development placeholder - generate your own for
# anything that is not this laboratory:
#
#     openssl rand -base64 48
#
# HS256 needs at least 32 bytes of key material.
# ---------------------------------------------------------------------------
security.jwt.secret=Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLW1lLXBsZWFzZQ==
security.jwt.expiration-minutes=30

logging.level.com.debuglab.checkout=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
