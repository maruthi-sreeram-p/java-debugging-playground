spring.application.name=student-registry
server.port=8080

# ---------------------------------------------------------------------------
# Datastore: in-memory H2. Nothing external has to be installed to run this.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Browse the data at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:studentdb   User: sa   Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.default-property-inclusion=always

logging.level.com.debuglab.studentregistry=DEBUG
logging.level.org.springframework.web=INFO
