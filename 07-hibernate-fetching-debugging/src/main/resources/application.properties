spring.application.name=course-enrolment
server.port=8080

spring.datasource.url=jdbc:h2:mem:enrolmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# The persistence context is closed when the service layer finishes, not when the
# HTTP response is written. Every endpoint is responsible for loading what it needs.
spring.jpa.open-in-view=false

# Every statement Hibernate issues is printed, together with a running count.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.debuglab.enrolment=DEBUG
