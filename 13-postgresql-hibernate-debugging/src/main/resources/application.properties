spring.application.name=asset-tracking
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL from docker-compose.yml, published on host port 5433 so that it
# cannot clash with a PostgreSQL you already run on the default port.
#
# Throwaway credentials from docker-compose.yml. Replace all three if you point
# this application at your own PostgreSQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/assetsdb
spring.datasource.username=assetuser
spring.datasource.password=assetpw
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema belongs to the data platform team and lives in db/init.sql.
# This application neither creates it nor alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

server.error.include-message=always

logging.level.com.debuglab.assets=DEBUG
logging.level.org.hibernate.SQL=DEBUG
