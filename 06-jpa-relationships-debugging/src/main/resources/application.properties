spring.application.name=order-service
server.port=8080

# ---------------------------------------------------------------------------
# MySQL from docker-compose.yml, published on host port 3307 so that it cannot
# clash with a MySQL you already run on the default port.
#
# These credentials are the throwaway ones from docker-compose.yml. Replace all
# three values if you point this application at your own MySQL server.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/ordersdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=orderuser
spring.datasource.password=orderpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This service owns its schema: the tables are generated from the entity
# mappings on every start, and the seed script then loads the customers.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.debuglab.orders=DEBUG
