services:
  mysql:
    image: mysql:8.0
    container_name: debuglab06-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: ordersdb
      MYSQL_USER: orderuser
      MYSQL_PASSWORD: orderpw
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20
