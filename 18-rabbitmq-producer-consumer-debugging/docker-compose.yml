services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: debuglab18-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shipuser
      RABBITMQ_DEFAULT_PASS: shippw
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
