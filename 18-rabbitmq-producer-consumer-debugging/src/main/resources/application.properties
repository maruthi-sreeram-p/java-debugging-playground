spring.application.name=shipment-notifications
server.port=8080

spring.datasource.url=jdbc:h2:mem:shippingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# RabbitMQ from docker-compose.yml, published on host port 5673 so that it
# cannot clash with a broker you already run on the default port. The
# management UI is on http://localhost:15673 with the same credentials.
#
# Throwaway credentials. Replace them if you point this at your own broker.
# ---------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=shipuser
spring.rabbitmq.password=shippw

logging.level.com.debuglab.shipping=INFO
logging.level.org.springframework.amqp=INFO
