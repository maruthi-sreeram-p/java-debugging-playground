spring.application.name=notification-dispatch
server.port=8080

# ---------------------------------------------------------------------------
# Datastore: in-memory H2. Nothing external has to be installed to run this.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:notifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Notification settings
# ---------------------------------------------------------------------------
# How many times a single notification may be attempted before it is marked FAILED.
notification.retry.attempts=5
notification.retry.backoff-millis=200

# Placeholders. Replace with your own provider details if you wire a real gateway.
notification.email.sender=alerts@campus.edu
notification.sms.gateway=REPLACE_WITH_YOUR_GATEWAY_ID

logging.level.com.debuglab=DEBUG
