spring.application.name=employee-directory
server.port=8080

# ---------------------------------------------------------------------------
# MySQL. The docker-compose.yml in the project root publishes MySQL on 3307 so
# that it does not clash with a MySQL you may already run on the default port.
#
# Credentials are the throwaway ones defined in docker-compose.yml. If you point
# this application at your own MySQL server, replace the three values below with
# your own - nothing else in the project holds credentials.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/hrdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=hruser
spring.datasource.password=hrpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=hr-pool

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.debuglab.hr=DEBUG
logging.level.com.zaxxer.hikari=INFO
