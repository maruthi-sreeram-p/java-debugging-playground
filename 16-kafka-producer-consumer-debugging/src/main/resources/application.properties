spring.application.name=order-events
server.port=8080

# ---------------------------------------------------------------------------
# H2 holds the orders and the projection the consumer builds.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Kafka from docker-compose.yml, published on host port 9094 so that it cannot
# clash with a broker you already run on the default port.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9094

# The topic order events are published to.
app.kafka.orders-topic=order-events

logging.level.com.debuglab.orderevents=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=WARN
